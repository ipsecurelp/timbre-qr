<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre QR - LXT Seguridad</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:linear-gradient(135deg,#050505,#111827);
  color:white;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.panel{
  width:100%;
  max-width:430px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:24px;
  padding:26px;
  box-shadow:0 20px 45px rgba(0,0,0,.45);
  text-align:center;
}

.logo{
  width:100%;
  max-width:310px;
  margin:0 auto 18px;
  display:block;
}

h1{
  margin:8px 0 5px;
  font-size:32px;
}

.subtitulo{
  color:#cbd5e1;
  margin-bottom:25px;
}

.depto{
  background:rgba(255,255,255,0.09);
  border-radius:18px;
  padding:18px;
  margin-bottom:16px;
  text-align:left;
}

.depto h2{
  margin:0 0 6px;
  font-size:22px;
}

.depto p{
  margin:0 0 14px;
  color:#cbd5e1;
}

.btn{
  display:block;
  width:100%;
  padding:15px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  color:white;
  font-size:18px;
  font-weight:bold;
  background:#22c55e;
}

.btn:active{
  transform:scale(.98);
}

.footer{
  margin-top:22px;
  font-size:13px;
  color:#94a3b8;
}
</style>
</head>

<body>

<div class="panel">

  <img src="logo-lxt.png" alt="LXT Seguridad Electrónica" class="logo">

  <h1>Timbre QR</h1>
  <div class="subtitulo">Seleccione el departamento</div>

  <div class="depto">
    <h2>Departamento 1</h2>
    <p>TEST PANTALLA</p>
    <a class="btn" href="https://1325.3cx.cloud/testpantalla">
      📞 Llamar / Mensaje
    </a>
  </div>

  <div class="depto">
    <h2>Departamento 2</h2>
    <p>PRUEBA CEL 2</p>
    <a class="btn" href="https://1325.3cx.cloud/pruebacel2">
      📞 Llamar / Mensaje
    </a>
  </div>

  <div class="footer">
    Sistema de prueba - LXT Seguridad Electrónica
  </div>

</div>

</body>
</html>
